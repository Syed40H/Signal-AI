services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: signalai
      POSTGRES_PASSWORD: signalai
      POSTGRES_DB: signalai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalai -d signalai"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://signalai:signalai@db:5432/signalai
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
